services:
    # App
    test.console.AppCLI:
        class: renovant\core\console\App
        properties:
            name: TEST-CONSOLE
            modules:
                DB:
                    cmd: console db
                    namespace: test.console
                MOD1:
                    cmd: console mod1
                    namespace: test.console
                CRON:
                    cmd: console cron
                    namespace: test.console

    # Dispatcher
    test.console.Dispatcher:
        class: renovant\core\console\Dispatcher
        properties:
            routes:
                db: test.console.AbstractController
                mod1: test.console.ActionController
                cron: test.console.SimpleController
            resourcesDir: templates/
    # controllers
    test.console.SimpleController:
        class: test\console\controller\SimpleController
    test.console.ActionController:
        class: test\console\controller\ActionController
    test.console.AbstractController:
        class: test\console\controller\AbstractController
